# Installer manifest template for winget-pkgs.
# Replace:
#   {VERSION}      — e.g. 0.3.0
#   {SHA256}       — UPPERCASE hex from FileHasher-{VERSION}.msi.sha256
#                    (the sidecar is `sha256sum -b` format: "<hash> *<file>";
#                    only the hash goes here)
#   {PRODUCT_CODE} — this build's MSI ProductCode GUID, braces included. It
#                    regenerates every build (see installer/FileHasher.wxs).
#                    wingetcreate extracts it automatically; to read it by
#                    hand on Windows:
#                      $db = (New-Object -ComObject WindowsInstaller.Installer).OpenDatabase("FileHasher-{VERSION}.msi", 0)
#                      $v  = $db.OpenView("SELECT Value FROM Property WHERE Property='ProductCode'"); $v.Execute()
#                      $v.Fetch().StringData(1)
PackageIdentifier: FSPProductions.FileHasher
PackageVersion: "{VERSION}"
InstallerLocale: en-US
Platform:
  - Windows.Desktop
MinimumOSVersion: 10.0.17763.0
InstallerType: wix
Scope: machine
InstallModes:
  - interactive
  - silent
  - silentWithProgress
UpgradeBehavior: install
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/fsantiago07044/filehasher/releases/download/v{VERSION}/FileHasher-{VERSION}.msi
    InstallerSha256: "{SHA256}"
    ProductCode: "{PRODUCT_CODE}"
ManifestType: installer
ManifestVersion: 1.6.0
