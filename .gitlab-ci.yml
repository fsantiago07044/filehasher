# .gitlab-ci.yml
#
# Tag-driven build, sign, and release pipeline for FileHasher.
#
# Triggers
# ────────
#   • A pushed tag matching   vMAJOR.MINOR.PATCH   → full pipeline
#       build → test → sign → release
#     Produces signed deliverables under /src/filehasher/signed-builds/ on the
#     Linux signer host AND a GitLab Release with package assets attached.
#
#   • The "Run pipeline" web button (any ref) → build → test → sign
#     Useful for re-signing or ad-hoc builds. The output filename is suffixed
#     with -build.<short_sha>, the FileHasher-latest.* symlinks are NOT touched,
#     and no GitLab Release is created.
#
# Stage order: build runs first because the FlaUI tests in FileHasherApp.Tests
# launch the actual FileHasher.exe via UI Automation. The test job points the
# AppFixture at the published binary via FILEHASHER_EXE so the tests verify the
# exact self-contained single-file artifact that will be signed and shipped.
# `sign` lists `test` as a need so a red test run blocks the HSM signature.
#
# Runners required
# ────────────────
#   • Tag "windows"      — Windows Server runner, shell/powershell executor,
#                          .NET 8 SDK, interactive desktop session for FlaUI.
#   • Tag "linux-signer" — Ubuntu host with HSM token, osslsigncode, the cert
#                          chain at /root/signing-directory/signing-dir,
#                          release-cli, zip. Runs as root.
#
# Required CI/CD variables (Settings → CI/CD → Variables)
# ───────────────────────────────────────────────────────
#   HSM_PIN — the PKCS#11 token PIN. Mark Masked AND Protected. Protect tag
#             refs matching v* so this variable is only injected into release
#             pipelines.
#
# See ci/README.md for one-time runner setup instructions.

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  PUBLISH_DIR: "FileHasherApp/bin/Release/net8.0-windows/win-x64/publish"
  SIGNED_DIR: "/src/filehasher/signed-builds"

stages:
  - build
  - test
  - sign
  - release

workflow:
  rules:
    # Tag pipeline (release).
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    # Manual run via the GitLab UI "Run pipeline" button.
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ── BUILD ────────────────────────────────────────────────────────────────────

build:
  stage: build
  tags:
    - windows
  cache:
    key: nuget-$CI_PROJECT_ID
    paths:
      - .nuget/packages/
  script:
    - |
      # Validate the tag matches <Version> in the csproj (tag pipelines only).
      if ($env:CI_COMMIT_TAG) {
        $tagVersion = $env:CI_COMMIT_TAG -replace '^v', ''
        $csproj     = Get-Content FileHasherApp/FileHasherApp.csproj -Raw
        $needle     = "<Version>$([regex]::Escape($tagVersion))</Version>"
        if ($csproj -notmatch $needle) {
          Write-Error ("Tag '{0}' (version '{1}') does not match <Version> in FileHasherApp.csproj. Bump the csproj <Version>, commit, then re-tag." -f $env:CI_COMMIT_TAG, $tagVersion)
          exit 1
        }
        Write-Host "Tag/csproj version match: $tagVersion"
        $version = $tagVersion
      } else {
        $csproj = Get-Content FileHasherApp/FileHasherApp.csproj -Raw
        if ($csproj -match '<Version>([^<]+)</Version>') {
          $version = $matches[1]
        } else {
          Write-Error 'Could not read <Version> from FileHasherApp/FileHasherApp.csproj'
          exit 1
        }
      }
      "VERSION=$version" | Out-File -FilePath build.env -Encoding ascii
      Write-Host "Building FileHasher version: $version"

      Push-Location FileHasherApp
      dotnet publish `
        -c Release `
        -r win-x64 `
        --self-contained true `
        -p:PublishSingleFile=true `
        -p:EnableCompressionInSingleFile=true `
        -p:DebugType=embedded `
        -p:Version=$version
      $code = $LASTEXITCODE
      Pop-Location
      if ($code -ne 0) { exit $code }
  artifacts:
    name: "FileHasher-$CI_COMMIT_SHORT_SHA-publish"
    paths:
      - $PUBLISH_DIR/
    reports:
      dotenv: build.env
    expire_in: 30 days

# ── TEST ─────────────────────────────────────────────────────────────────────

test:
  stage: test
  tags:
    - windows
  needs:
    - job: build
      artifacts: true
  cache:
    key: nuget-$CI_PROJECT_ID
    paths:
      - .nuget/packages/
  variables:
    # Tell FileHasherApp.Tests/AppFixture.cs to launch the published self-contained
    # binary, not a side-effect bin output. This makes the FlaUI tests verify the
    # exact .exe that the sign stage will sign.
    FILEHASHER_EXE: "$CI_PROJECT_DIR/FileHasherApp/bin/Release/net8.0-windows/win-x64/publish/FileHasher.exe"
  script:
    - dotnet test FileHasherApp.Tests/FileHasherApp.Tests.csproj `
        -c Release `
        --logger "console;verbosity=normal" `
        --logger "trx;LogFileName=test-results.trx" `
        --results-directory TestResults
  artifacts:
    when: always
    paths:
      - TestResults/
    expire_in: 7 days

# ── SIGN ─────────────────────────────────────────────────────────────────────

sign:
  stage: sign
  tags:
    - linux-signer
  needs:
    - job: build
      artifacts: true
    - job: test
  variables:
    OSSLSIGNCODE:  "/usr/local/bin/osslsigncode"
    SIGNING_BASE:  "/root/signing-directory/signing-dir"
    PKCS11_ENGINE: "/usr/lib/x86_64-linux-gnu/engines-3/pkcs11.so"
    PKCS11_MODULE: "/usr/lib/x86_64-linux-gnu/opensc-pkcs11.so"
    TIMESTAMP_URL: "http://timestamp.digicert.com"
    SIGN_NAME:     "FSP Productions LLC"
    SIGN_URL:      "https://www.fspproductions.com/software-projects"
  script:
    - bash ci/sign.sh
  artifacts:
    name: "FileHasher-${VERSION}-signed"
    paths:
      - signed-out/
    expire_in: 30 days

# ── RELEASE ──────────────────────────────────────────────────────────────────

release:
  stage: release
  tags:
    - linux-signer
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - job: build
      artifacts: true
    - job: sign
      artifacts: true
  script:
    - bash ci/release.sh
