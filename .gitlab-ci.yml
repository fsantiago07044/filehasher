# .gitlab-ci.yml
#
# Tag-driven build, sign, and release pipeline for FileHasher.
#
# Triggers
# ────────
#   • A pushed tag matching   vMAJOR.MINOR.PATCH   → full pipeline
#       audit → build → test → sign → package-msi → sign-msi → release → wasabi
#       → mirror → winget → chocolatey
#     Produces signed deliverables under /src/filehasher/signed-builds/ on the
#     Linux signer host (exe + zip + msi, each with a .sha256 sidecar), a
#     GitLab Release with package assets attached, AND a mirrored GitHub
#     Release on the configured target repo with the same six signed assets.
#     The mirror stage is allow_failure: true — a GitHub outage or expired
#     PAT surfaces as a yellow warning but doesn't fail the overall release.
#
#   • The "Run pipeline" web button (any ref)
#       → audit → build → test → sign → package-msi → sign-msi
#     Useful for re-signing or ad-hoc builds. The output filename is suffixed
#     with -build.<short_sha>, the FileHasher-latest.* symlinks are NOT touched,
#     and no GitLab Release or GitHub mirror is created.
#
# MSI build topology (why the sign → package-msi → sign-msi ping-pong):
#   The MSI must wrap the ALREADY-SIGNED exe and then be Authenticode-signed
#   itself, and the two capabilities live on different hosts — the HSM is on
#   the Linux signer, while WiX refuses to run anywhere but Windows
#   (wixtoolset/issues#7154, closed not-planned). So the signed exe travels
#   back to the Windows runner as a job artifact (~65 MB, under the server's
#   100 MB artifact cap), wix builds + ICE-validates the MSI there, and the
#   unsigned MSI returns to the signer for the second signing pass.
#
# Stage order:
#   • `audit` runs first as a quick supply-chain sanity check. It is marked
#     allow_failure: true so vulnerable-package findings show as a yellow warning
#     in the pipeline view rather than blocking the release; the goal is
#     visibility, not gating.
#   • `build` runs next because the FlaUI tests in FileHasherApp.Tests launch
#     the actual FileHasher.exe via UI Automation. The test job points the
#     AppFixture at the published binary via FILEHASHER_EXE so the tests verify
#     the exact self-contained single-file artifact that will be signed.
#   • `sign` lists `test` as a need so a red test run blocks the HSM signature.
#
# Runners required
# ────────────────
#   • Tag "windows"      — Windows Server runner, shell/powershell executor,
#                          .NET 10 SDK, the wix dotnet tool (MSI build + ICE
#                          validation), interactive desktop session for FlaUI.
#   • Tag "linux-signer" — Ubuntu host with HSM token, osslsigncode, the cert
#                          chain at the path configured via the SIGNING_BASE_PATH
#                          CI/CD variable, release-cli, zip. Runs as root.
#
# Required CI/CD variables (Settings → CI/CD → Variables)
# ───────────────────────────────────────────────────────
#   HSM_PIN            — the PKCS#11 token PIN.
#   SIGNING_BASE_PATH  — absolute path on the linux-signer host to the directory
#                        holding chain.pem (the code-signing cert chain). Held
#                        in CI/CD variables rather than hardcoded in this file
#                        so the path doesn't appear in the public mirror.
#
# Both variables are marked Masked + Hidden + Protected. The v* tag glob is
# added to Settings → Repository → Protected tags so they're only injected
# into pipelines triggered by release tags.
#
# See ci/README.md for one-time runner setup instructions.

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  PUBLISH_DIR: "FileHasherApp/bin/Release/net10.0-windows/win-x64/publish"
  SIGNED_DIR: "/src/filehasher/signed-builds"

stages:
  - audit
  - build
  - test
  - sign
  - package-msi
  - sign-msi
  - release
  - wasabi
  - mirror
  - winget
  - chocolatey

workflow:
  rules:
    # Tag pipeline (release).
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    # Manual run via the GitLab UI "Run pipeline" button.
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ── AUDIT ────────────────────────────────────────────────────────────────────
#
# Supply-chain sanity check: scan NuGet dependencies (direct + transitive) for
# packages with known CVEs against the GitHub Advisory Database. Runs in the
# first stage so any finding is visible at the top of the pipeline. Marked
# allow_failure: true — findings produce a yellow warning, not a red blocker.

audit:
  stage: audit
  tags:
    - windows
  allow_failure: true
  cache:
    key: nuget-$CI_PROJECT_ID
    paths:
      - .nuget/packages/
  script:
    - |
      # Advisories that have been reviewed and judged not to apply to this
      # project's threat model. Each entry should mirror a <NuGetAuditSuppress>
      # in the relevant csproj (which silences the same finding for local
      # `dotnet restore` users). Keep the two lists in sync; the script
      # comments and csproj comments should reference each other.
      $suppressedAdvisories = @(
        # GHSA-rxg9-xrhp-64gj — System.Drawing.Common 5.0.2 (transitive via
        # FlaUI in FileHasherApp.Tests). Test-only dep, never shipped; tests
        # do not process attacker-controlled images. See the matching
        # <NuGetAuditSuppress> in FileHasherApp.Tests.csproj.
        'https://github.com/advisories/GHSA-rxg9-xrhp-64gj'
      )

      Write-Host "Restoring solution to populate NuGet metadata..."
      dotnet restore filehasher.sln
      if ($LASTEXITCODE -ne 0) {
        Write-Error "dotnet restore failed; cannot audit packages."
        exit $LASTEXITCODE
      }
      Write-Host ""
      Write-Host "Scanning for vulnerable packages (direct + transitive)..."
      $output = dotnet list filehasher.sln package --vulnerable --include-transitive 2>&1 | Out-String
      Write-Host $output

      if ($output -notmatch 'has the following vulnerable packages') {
        Write-Host "No vulnerable packages found."
        exit 0
      }

      # Pull every GHSA URL out of the output and compare against the suppression list.
      $foundAdvisories = [regex]::Matches($output, 'https://github\.com/advisories/GHSA-[a-zA-Z0-9-]+') |
                           ForEach-Object { $_.Value } |
                           Sort-Object -Unique
      $unsuppressed = @($foundAdvisories | Where-Object { $_ -notin $suppressedAdvisories })

      if ($unsuppressed.Count -eq 0) {
        Write-Host ""
        Write-Host "All findings are on the suppression list; treating scan as clean."
        Write-Host "Suppressed advisories matched: $($foundAdvisories -join ', ')"
        Write-Host "Justifications: see `$suppressedAdvisories at the top of this script."
        exit 0
      }

      Write-Warning "Unsuppressed vulnerable packages detected — see output above. This job is marked failed but the pipeline will continue (allow_failure: true)."
      Write-Warning "Unsuppressed advisories: $($unsuppressed -join ', ')"
      exit 1

# ── BUILD ────────────────────────────────────────────────────────────────────

build:
  stage: build
  tags:
    - windows
  cache:
    key: nuget-$CI_PROJECT_ID
    paths:
      - .nuget/packages/
  script:
    - |
      # Validate the tag matches <Version> in the csproj (tag pipelines only).
      if ($env:CI_COMMIT_TAG) {
        $tagVersion = $env:CI_COMMIT_TAG -replace '^v', ''
        $csproj     = Get-Content FileHasherApp/FileHasherApp.csproj -Raw
        $needle     = "<Version>$([regex]::Escape($tagVersion))</Version>"
        if ($csproj -notmatch $needle) {
          Write-Error ("Tag '{0}' (version '{1}') does not match <Version> in FileHasherApp.csproj. Bump the csproj <Version>, commit, then re-tag." -f $env:CI_COMMIT_TAG, $tagVersion)
          exit 1
        }
        Write-Host "Tag/csproj version match: $tagVersion"
        $version = $tagVersion
      } else {
        $csproj = Get-Content FileHasherApp/FileHasherApp.csproj -Raw
        if ($csproj -match '<Version>([^<]+)</Version>') {
          $version = $matches[1]
        } else {
          Write-Error 'Could not read <Version> from FileHasherApp/FileHasherApp.csproj'
          exit 1
        }
      }
      "VERSION=$version" | Out-File -FilePath build.env -Encoding ascii
      Write-Host "Building FileHasher version: $version"

      Push-Location FileHasherApp
      dotnet publish `
        -c Release `
        -r win-x64 `
        --self-contained true `
        -p:PublishSingleFile=true `
        -p:EnableCompressionInSingleFile=true `
        -p:DebugType=embedded `
        -p:Version=$version `
        -p:Deterministic=true `
        -p:ContinuousIntegrationBuild=true `
        -p:PathMap="$($env:CI_PROJECT_DIR)=/_/"
      $code = $LASTEXITCODE
      Pop-Location
      if ($code -ne 0) { exit $code }
  artifacts:
    name: "FileHasher-$CI_COMMIT_SHORT_SHA-publish"
    paths:
      - $PUBLISH_DIR/
    reports:
      dotenv: build.env
    expire_in: 30 days

# ── TEST ─────────────────────────────────────────────────────────────────────

test:
  stage: test
  tags:
    - windows
  needs:
    - job: build
      artifacts: true
  cache:
    key: nuget-$CI_PROJECT_ID
    paths:
      - .nuget/packages/
  variables:
    # Tell FileHasherApp.Tests/AppFixture.cs to launch the published self-contained
    # binary, not a side-effect bin output. This makes the FlaUI tests verify the
    # exact .exe that the sign stage will sign.
    FILEHASHER_EXE: "$CI_PROJECT_DIR/FileHasherApp/bin/Release/net10.0-windows/win-x64/publish/FileHasher.exe"
  script:
    - dotnet test FileHasherApp.Tests/FileHasherApp.Tests.csproj `
        -c Release `
        --logger "console;verbosity=normal" `
        --logger "trx;LogFileName=test-results.trx" `
        --results-directory TestResults
  artifacts:
    when: always
    paths:
      - TestResults/
    expire_in: 7 days

# ── SIGN ─────────────────────────────────────────────────────────────────────

sign:
  stage: sign
  tags:
    - linux-signer
  needs:
    - job: build
      artifacts: true
    - job: test
  variables:
    OSSLSIGNCODE:  "/usr/local/bin/osslsigncode"
    # SIGNING_BASE_PATH (absolute path to the dir holding chain.pem) is injected
    # at job time as a Protected CI/CD variable from GitLab UI rather than
    # hardcoded here, so the internal disk layout doesn't appear in the public
    # mirror. See ci/README.md under "GitLab project settings" for the value.
    PKCS11_ENGINE: "/usr/lib/x86_64-linux-gnu/engines-3/pkcs11.so"
    PKCS11_MODULE: "/usr/lib/x86_64-linux-gnu/opensc-pkcs11.so"
    TIMESTAMP_URL: "http://timestamp.digicert.com"
    SIGN_NAME:     "FSP Productions LLC"
    SIGN_URL:      "https://www.fspproductions.com/software-projects"
  script:
    - bash ci/sign.sh
  # Only the signed exe travels onward as an artifact — package-msi on the
  # Windows runner needs it to build the MSI around it. The zip stays out to
  # keep the artifact under the server's 100 MB cap (exe+zip ≈ 135 MB).
  artifacts:
    name: "FileHasher-$CI_COMMIT_SHORT_SHA-signed-exe"
    paths:
      - signed-out/FileHasher-*.exe
    expire_in: 7 days

# ── PACKAGE-MSI ──────────────────────────────────────────────────────────────
#
# Wraps the signed exe (artifact from the sign stage) in an MSI via WiX and
# runs full ICE validation on it — `wix msi validate` needs Windows, which is
# also why this job can't live on the signer. Output is UNSIGNED; the next
# stage carries it back to the signer for the Authenticode pass. The wix CLI
# is a dotnet global tool installed for the gitlab-runner user, pinned to
# major version 5: v6+ requires accepting the Open Source Maintenance Fee
# EULA per host, which we don't want as a silent CI dependency (see
# ci/README.md "WiX toolset").

package-msi:
  stage: package-msi
  tags:
    - windows
  needs:
    - job: build      # build.env dotenv → $VERSION
      artifacts: true
    - job: sign       # signed-out/<basename>.exe
      artifacts: true
  variables:
    WIX: 'C:\Users\gitlab-runner\.dotnet\tools\wix.exe'
  script:
    - |
      if ($env:CI_COMMIT_TAG) {
        $basename = "FileHasher-$env:VERSION"
      } else {
        $basename = "FileHasher-$env:VERSION-build.$env:CI_COMMIT_SHORT_SHA"
      }
      $signedExe = "signed-out/$basename.exe"
      if (-not (Test-Path $signedExe)) {
        Write-Error "Signed exe not found at $signedExe (sign-stage artifact missing?)"
        exit 1
      }
      New-Item -ItemType Directory -Force msi-out | Out-Null

      # MSI ProductVersion must be purely numeric — Windows Installer rejects
      # semver prerelease labels (WIX1148 / ICE24). A prerelease version maps
      # to a 4th (revision) field instead: 0.3.1-beta -> 0.3.1.1. The revision
      # is ignored by Windows Installer's version comparisons (so beta and
      # final are the SAME version to MajorUpgrade — uninstall a beta MSI
      # before installing the same-numbered release), but it keeps the beta
      # visibly distinct in Apps & Features / MSI properties. The full semver
      # string still flows into filenames and the MSI's display strings.
      $parts      = $env:VERSION -split '-', 2
      $msiVersion = $parts[0]
      if ($parts.Count -gt 1) {
        $msiVersion = "$($parts[0]).1"
        Write-Host "Prerelease version $env:VERSION -> MSI ProductVersion $msiVersion"
      }

      Write-Host "Building MSI from installer/FileHasher.wxs"
      & $env:WIX build installer/FileHasher.wxs `
        -arch x64 `
        -d Version=$msiVersion `
        -d DisplayVersion=$env:VERSION `
        -d SignedExe=$signedExe `
        -pdbtype none `
        -o "msi-out/$basename-unsigned.msi"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      Write-Host "Running ICE validation"
      & $env:WIX msi validate "msi-out/$basename-unsigned.msi"
      if ($LASTEXITCODE -ne 0) {
        Write-Error "ICE validation failed — fix installer/FileHasher.wxs before releasing."
        exit $LASTEXITCODE
      }
  artifacts:
    name: "FileHasher-$CI_COMMIT_SHORT_SHA-msi-unsigned"
    paths:
      - msi-out/
    expire_in: 7 days

# ── SIGN-MSI ─────────────────────────────────────────────────────────────────
#
# Second HSM pass: Authenticode-signs the MSI built by package-msi, writes the
# .sha256 sidecar, and persists both to $SIGNED_DIR alongside the exe/zip from
# the first sign stage (plus FileHasher-latest.msi* symlinks on tag pipelines).

sign-msi:
  stage: sign-msi
  tags:
    - linux-signer
  needs:
    - job: build
      artifacts: true
    - job: package-msi
      artifacts: true
  variables:
    OSSLSIGNCODE:  "/usr/local/bin/osslsigncode"
    PKCS11_ENGINE: "/usr/lib/x86_64-linux-gnu/engines-3/pkcs11.so"
    PKCS11_MODULE: "/usr/lib/x86_64-linux-gnu/opensc-pkcs11.so"
    TIMESTAMP_URL: "http://timestamp.digicert.com"
    SIGN_NAME:     "FSP Productions LLC"
    SIGN_URL:      "https://www.fspproductions.com/software-projects"
  script:
    - bash ci/sign-msi.sh

# ── RELEASE ──────────────────────────────────────────────────────────────────
#
# Note: release reads the signed deliverables from $SIGNED_DIR on the linux-signer
# host directly. We deliberately do NOT pass them through GitLab artifacts — they
# total ~135 MB and the round-trip would hit the GitLab server's 100 MB artifact
# size limit, but more importantly they're already on disk on the same host where
# this stage runs, so the upload/download would be pure waste.

release:
  stage: release
  tags:
    - linux-signer
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - job: build
      artifacts: true
    - job: sign
    - job: sign-msi
  script:
    - bash ci/release.sh

# ── WASABI ───────────────────────────────────────────────────────────────────
#
# Publishes the six signed assets to Wasabi S3, which is where the Microsoft
# Store listing's package URL points.
#
# Why this exists at all: the Store rejects a package URL that redirects ("The
# package URL redirects to another URL. Provide a download URL without
# redirection."), and every GitHub release-download URL 302s to a signed,
# short-lived URL on release-assets.githubusercontent.com. So GitHub can serve
# winget, Chocolatey and Scoop, which all follow redirects, but it cannot serve
# that one Store field. Wasabi returns the object directly.
#
# Only the Store points here on purpose. Wasabi's free egress policy allows
# monthly egress up to the account's stored volume, so keeping the other three
# channels on GitHub keeps that budget almost untouched.
#
# The job refuses to overwrite an existing version prefix. A binary the Store
# has certified must never change at its URL, so a re-run against a version
# that is already up fails loudly instead of silently replacing it.
#
# One-time prerequisites (ci/README.md section 1e): the Wasabi IAM sub-user
# `filehasher-ci` (upload-only, scoped to filehasher/*) and the
# WASABI_ACCESS_KEY_ID / WASABI_SECRET_ACCESS_KEY Protected + Masked variables.
# aws-cli is already present on the signer. allow_failure like the other
# publish stages: a Wasabi hiccup yellow-flags rather than failing the release,
# and the Store step is manual anyway.

wasabi-upload:
  stage: wasabi
  tags:
    - linux-signer
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  allow_failure: true
  needs:
    - job: build
      artifacts: true
    - job: sign-msi
  script:
    - bash ci/upload-wasabi.sh

# ── MIRROR ───────────────────────────────────────────────────────────────────
#
# Pushes the same v${VERSION} release that the prior stage published to GitLab
# to the GitHub mirror as a GitHub Release with the same six signed assets.
# The MSI's GitHub download URL is the one the winget manifest pins, so a
# failed mirror also blocks that version's winget submission (winget/README.md).
# Uses gh CLI authenticated against /root/.config/gh/hosts.yml (one-time setup
# documented in ci/README.md under "GitHub release mirroring"). Marked
# allow_failure: true so a GitHub-side hiccup doesn't fail the overall release.

mirror-github:
  stage: mirror
  tags:
    - linux-signer
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  allow_failure: true
  needs:
    - job: build
      artifacts: true
    - job: release
  script:
    - bash ci/mirror-to-github.sh

# ── WINGET ───────────────────────────────────────────────────────────────────
#
# Submits the new version to microsoft/winget-pkgs: wingetcreate downloads the
# MSI from the GitHub Release (so this must run after mirror-github), computes
# its SHA256, extracts the ProductCode, carries every other field over from
# the previous version's merged manifests, and opens the PR from the
# fsantiago07044 fork. Version-specific locale fields that would carry over
# stale are patched between generate and submit: ReleaseNotesUrl is rewritten
# to this tag and the ReleaseNotes line is replaced with this release's summary
# from winget/release-notes.txt. allow_failure like the mirror stage — a winget-side
# failure yellow-flags the pipeline, and the manual fallback is documented in
# winget/README.md. Note: needs on mirror-github still runs this job if that
# allow_failure job failed; wingetcreate then fails fast on the missing asset
# URL, which is the desired signal.
#
# One-time prerequisites (ci/README.md): wingetcreate.exe standalone on the
# Windows runner (section 1c) and the WINGET_PAT Protected variable (classic
# PAT, public_repo scope — wingetcreate needs it to push the manifest branch
# to the winget-pkgs fork and open the upstream PR). The token is passed on
# the command line, which is acceptable on this private single-user runner.

winget-update:
  stage: winget
  tags:
    - windows
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  allow_failure: true
  needs:
    - job: build
      artifacts: true
    - job: mirror-github
  variables:
    WINGETCREATE: 'C:\GitLab-Runner\tools\wingetcreate.exe'
    PACKAGE_ID:   'FSPProductions.FileHasher'
  script:
    - |
      if (-not $env:WINGET_PAT) {
        Write-Error "WINGET_PAT is not set. It is a Protected CI/CD variable, injected only on protected refs — see ci/README.md."
        exit 1
      }
      if (-not (Test-Path $env:WINGETCREATE)) {
        Write-Error "wingetcreate not found at $env:WINGETCREATE — one-time install in ci/README.md section 1c."
        exit 1
      }

      # Self-heal a missing WinGetUtil.dll (wingetcreate's native manifest
      # validator; NOT bundled into the standalone exe) by downloading it into
      # the job workspace and putting that dir on PATH, which native P/Invoke
      # resolution searches. A rebuilt runner missing the ci/README 1c step
      # then still works. Its OTHER prerequisite, the VC++ x64 runtime, needs
      # an Administrator install and cannot be self-healed here; see 1c.
      $toolsDll = Join-Path (Split-Path $env:WINGETCREATE) 'WinGetUtil.dll'
      if (-not (Test-Path $toolsDll)) {
        Write-Host "WinGetUtil.dll not found next to wingetcreate; fetching into job workspace"
        $v = '1.29.280'
        Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.windowspackagemanager.utils/$v/microsoft.windowspackagemanager.utils.$v.nupkg" -OutFile wpm-utils.zip
        Expand-Archive wpm-utils.zip wpm-utils -Force
        New-Item -ItemType Directory -Force wingetutil | Out-Null
        Copy-Item wpm-utils\runtimes\win-x64\native\WinGetUtil.dll wingetutil\
        $env:Path = "$pwd\wingetutil;$env:Path"
      }

      $url = "https://github.com/fsantiago07044/filehasher/releases/download/v$($env:VERSION)/FileHasher-$($env:VERSION).msi"

      Write-Host "Generating winget manifests for $($env:PACKAGE_ID) $($env:VERSION)"
      Write-Host "Installer URL: $url"
      & $env:WINGETCREATE update $env:PACKAGE_ID --version $env:VERSION --urls $url --out winget-out --token $env:WINGET_PAT
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      $manifestDir = "winget-out\manifests\f\FSPProductions\FileHasher\$($env:VERSION)"
      if (-not (Test-Path $manifestDir)) {
        Write-Error "Expected manifest directory not found: $manifestDir"
        exit 1
      }

      # Patch version-specific locale fields carried over from the previous
      # version's merged manifest. ReleaseNotes is REPLACED (not dropped) with
      # this release's summary from winget/release-notes.txt: the winget-pkgs
      # validation bot flags a version that removes a property the published
      # previous version had ("Missing property ReleaseNotes", seen on the
      # v0.3.1 PR). The file's first line must be the current tag (a staleness
      # gate, so a forgotten update fails loudly instead of submitting the
      # previous release's notes); the remaining non-blank lines are joined
      # into the single-line note. Assumes single-line manifest values, which
      # is what our manifests use.
      $notesFile = 'winget/release-notes.txt'
      if (-not (Test-Path $notesFile)) {
        Write-Error "winget/release-notes.txt not found; it must be updated as part of every release commit (see ci/README.md, Releasing a new version)."
        exit 1
      }
      $nf = @(Get-Content $notesFile | Where-Object { $_.Trim() })
      if ($nf.Count -lt 2 -or $nf[0].Trim() -ne "v$($env:VERSION)") {
        Write-Error "winget/release-notes.txt is stale: first line is '$($nf[0])', expected 'v$($env:VERSION)'. Update it as part of the release commit (see ci/README.md, Releasing a new version)."
        exit 1
      }
      $releaseNotes = (($nf | Select-Object -Skip 1) -join ' ') -replace "'", "''"

      $locale = Join-Path $manifestDir "$($env:PACKAGE_ID).locale.en-US.yaml"
      if (Test-Path $locale) {
        $patched  = @()
        $hadNotes = $false
        foreach ($line in Get-Content $locale) {
          if ($line -match '^ReleaseNotes:') {
            $patched += "ReleaseNotes: '$releaseNotes'"
            $hadNotes = $true
          } elseif ($line -match '^ReleaseNotesUrl:') {
            if (-not $hadNotes) {
              $patched += "ReleaseNotes: '$releaseNotes'"
              $hadNotes = $true
            }
            $patched += "ReleaseNotesUrl: https://github.com/fsantiago07044/filehasher/releases/tag/v$($env:VERSION)"
          } else {
            $patched += $line
          }
        }
        Set-Content -Path $locale -Value $patched -Encoding utf8
        Write-Host "Patched version-specific locale fields in $locale"
      }

      Write-Host "Submitting PR to microsoft/winget-pkgs"
      & $env:WINGETCREATE submit --token $env:WINGET_PAT $manifestDir
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  # Keep the generated manifests for audit / manual resubmission on failure.
  artifacts:
    name: "FileHasher-$CI_COMMIT_SHORT_SHA-winget-manifests"
    paths:
      - winget-out/
    expire_in: 30 days
    when: always

# ── CHOCOLATEY ───────────────────────────────────────────────────────────────
#
# Packs and pushes the version to the Chocolatey Community Repository
# (community.chocolatey.org/packages/filehasher). Chocolatey hosts no
# binaries here: the nupkg is a few KB of metadata plus
# tools/chocolateyinstall.ps1, which downloads the signed MSI from the GitHub
# Release at install time and refuses to proceed unless its SHA256 matches
# the checksum baked into the script. So this must run after mirror-github,
# same as winget-update, and for the same reason.
#
# The job downloads the published MSI and recomputes its SHA256 rather than
# trusting the sidecar: that pins the checksum to the bytes users will
# actually fetch and proves the release URL is live before a package pointing
# at it goes public. A sidecar/recomputed mismatch fails the job.
#
# The package sources in chocolatey/ are templates; {VERSION}, {SHA256} and
# {RELEASE_NOTES} are substituted into a staged copy under chocolatey-out/,
# and the pack is refused if any placeholder survives. Release notes come
# from winget/release-notes.txt, shared with winget-update (same staleness
# gate: first line must be this tag).
#
# Pushing an already-published version returns a 409, which would make a
# retry of this job fail on nothing, so the job queries the repository first
# and skips the push if the version is already there. Everything up to the
# pack still runs, so the nupkg is always in the artifacts.
#
# allow_failure like mirror-github and winget-update. Note that unlike winget,
# a Chocolatey submission is a push, not a PR: the version lands in the
# repository's moderation queue immediately and there is nothing to re-open if
# a later step needs fixing, so a rejected review is corrected by pushing the
# SAME version again (see chocolatey/README.md).
#
# One-time prerequisites (ci/README.md section 1d): the Chocolatey CLI on the
# Windows runner, a community.chocolatey.org account, and the CHOCO_API_KEY
# Protected + Masked variable holding that account's push key. With the key
# absent the job fails fast and yellow-flags, which is the intended state
# until the account exists.

chocolatey-push:
  stage: chocolatey
  tags:
    - windows
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  allow_failure: true
  needs:
    # artifacts: true is what carries the build job's dotenv $VERSION, same as
    # winget-update; the published binary itself is not used here.
    - job: build
      artifacts: true
    - job: mirror-github
  variables:
    PACKAGE_ID: 'filehasher'
    CHOCO_SOURCE: 'https://push.chocolatey.org/'
    GITHUB_REPO: 'fsantiago07044/filehasher'
  script:
    - |
      if (-not $env:CHOCO_API_KEY) {
        Write-Error "CHOCO_API_KEY is not set. It is a Protected + Masked CI/CD variable holding the community.chocolatey.org push key; see ci/README.md section 1d."
        exit 1
      }
      if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
        Write-Error "The Chocolatey CLI is not on PATH; one-time install in ci/README.md section 1d."
        exit 1
      }

      $tag     = "v$($env:VERSION)"
      $msiName = "FileHasher-$($env:VERSION).msi"
      $base    = "https://github.com/$($env:GITHUB_REPO)/releases/download/$tag"

      # Pin the checksum to the bytes actually published, and cross-check the
      # sidecar that ships next to them. Invoke-WebRequest renders a progress
      # bar even to a non-interactive host, at a large cost on a 60 MB
      # download, so silence it first.
      $ProgressPreference = 'SilentlyContinue'
      Write-Host "Downloading $base/$msiName"
      # A bare Invoke-WebRequest failure here surfaces as a raw WebException
      # that names no URL, and GitHub's 404 for a missing asset can arrive as
      # the misleading "connection was closed unexpectedly", so say what was
      # being fetched and what it usually means.
      function Get-ReleaseAsset($url, $out) {
        try {
          Invoke-WebRequest $url -OutFile $out -UseBasicParsing
        } catch {
          Write-Error "Could not download $url ($($_.Exception.Message)). The GitHub Release for $tag must exist with all six assets before this job runs; mirror-github creates it, so check that job first."
          exit 1
        }
      }
      Get-ReleaseAsset "$base/$msiName"        $msiName
      Get-ReleaseAsset "$base/$msiName.sha256" "$msiName.sha256"

      $computed = (Get-FileHash $msiName -Algorithm SHA256).Hash.ToLower()
      # Sidecar is `sha256sum -b` format: "<hash> *<filename>".
      $sidecar  = ((Get-Content "$msiName.sha256" -TotalCount 1) -split '\s+')[0].ToLower()
      if ($computed -ne $sidecar) {
        Write-Error "SHA256 mismatch on the published MSI. Sidecar says $sidecar, the downloaded file hashes to $computed."
        exit 1
      }
      Write-Host "SHA256 $computed (matches the published sidecar)"
      # The MSI itself is not part of the package; drop the 60 MB now that it
      # has been hashed.
      Remove-Item $msiName, "$msiName.sha256" -Force

      # Release notes, shared with winget-update. Same first-line staleness
      # gate so a forgotten update fails loudly instead of publishing the
      # previous release's notes.
      $notesFile = 'winget/release-notes.txt'
      if (-not (Test-Path $notesFile)) {
        Write-Error "winget/release-notes.txt not found; it must be updated as part of every release commit (see ci/README.md, Releasing a new version)."
        exit 1
      }
      $nf = @(Get-Content $notesFile | Where-Object { $_.Trim() })
      if ($nf.Count -lt 2 -or $nf[0].Trim() -ne $tag) {
        Write-Error "winget/release-notes.txt is stale: first line is '$($nf[0])', expected '$tag'. Update it as part of the release commit (see ci/README.md, Releasing a new version)."
        exit 1
      }
      $prose = ($nf | Select-Object -Skip 1) -join ' '
      $notes = "$prose`n`nFull release notes: https://github.com/$($env:GITHUB_REPO)/releases/tag/$tag"
      # The notes land inside a nuspec element, so escape XML metacharacters.
      $notes = $notes.Replace('&', '&amp;').Replace('<', '&lt;').Replace('>', '&gt;')

      # Stage the package: templates from chocolatey/, plus the repo's own
      # LICENSE (copied rather than duplicated in the tree, so it can't drift).
      if (Test-Path chocolatey-out) { Remove-Item chocolatey-out -Recurse -Force }
      New-Item -ItemType Directory -Force chocolatey-out | Out-Null
      Copy-Item chocolatey/* chocolatey-out -Recurse -Force
      Remove-Item chocolatey-out/README.md -Force -ErrorAction SilentlyContinue
      Copy-Item LICENSE chocolatey-out/tools/LICENSE.txt -Force

      foreach ($f in Get-ChildItem chocolatey-out -Recurse -File) {
        $text = Get-Content $f.FullName -Raw
        $text = $text.Replace('{VERSION}', $env:VERSION).Replace('{SHA256}', $computed).Replace('{RELEASE_NOTES}', $notes)
        Set-Content -Path $f.FullName -Value $text -Encoding utf8   # CPMR0054: the nuspec must be UTF-8
      }

      # Nothing may reach the repository with a placeholder still in it
      # (CPMR0019 rejects templated values, and a stale URL would install the
      # wrong version).
      $left = Select-String -Path (Get-ChildItem chocolatey-out -Recurse -File).FullName -Pattern '\{VERSION\}|\{SHA256\}|\{RELEASE_NOTES\}'
      if ($left) {
        $left | ForEach-Object { Write-Host $_.Line }
        Write-Error "Unsubstituted placeholders remain in the staged package."
        exit 1
      }

      # Catch a substitution that breaks the XML before choco pack reports it
      # as a bare parser error with a line number and no context. An
      # unescaped character in the release notes is the likely culprit.
      try { [xml](Get-Content chocolatey-out\filehasher.nuspec -Raw) | Out-Null }
      catch {
        Write-Error "The rendered nuspec is not well-formed XML: $($_.Exception.Message). Check the substituted releaseNotes for characters that need escaping."
        exit 1
      }

      Write-Host "Packing $($env:PACKAGE_ID) $($env:VERSION)"
      choco pack chocolatey-out\filehasher.nuspec --output-directory chocolatey-out
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      $nupkg = "chocolatey-out\$($env:PACKAGE_ID).$($env:VERSION).nupkg"
      if (-not (Test-Path $nupkg)) {
        Write-Error "Expected package not found: $nupkg"
        exit 1
      }

      # Skip the push when this version is already on the repository, so a
      # retry of this job is a no-op rather than a 409.
      $q = "https://community.chocolatey.org/api/v2/Packages(Id='$($env:PACKAGE_ID)',Version='$($env:VERSION)')"
      $published = $false
      try {
        Invoke-WebRequest $q -UseBasicParsing | Out-Null
        $published = $true
      } catch {
        $code = $_.Exception.Response.StatusCode.value__
        if ($code -eq 404) {
          Write-Host "$($env:PACKAGE_ID) $($env:VERSION) is not on the repository yet; pushing."
        } else {
          Write-Host "Could not determine whether $($env:PACKAGE_ID) $($env:VERSION) is published (HTTP $code); pushing anyway. A 409 from the push means it already is."
        }
      }
      if ($published) {
        Write-Host "$($env:PACKAGE_ID) $($env:VERSION) is already on community.chocolatey.org; skipping the push. The packed nupkg is in this job's artifacts."
        exit 0
      }

      choco push $nupkg --source $env:CHOCO_SOURCE --api-key $env:CHOCO_API_KEY
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      Write-Host "Pushed. Watch the review at https://community.chocolatey.org/packages/$($env:PACKAGE_ID)/$($env:VERSION)"
  # Keep the packed nupkg and the substituted sources for audit and for a
  # manual re-push if the push itself failed.
  artifacts:
    name: "FileHasher-$CI_COMMIT_SHORT_SHA-chocolatey-package"
    paths:
      - chocolatey-out/
    expire_in: 30 days
    when: always
