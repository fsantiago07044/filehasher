# .gitlab-ci.yml
#
# Tag-driven build, sign, and release pipeline for FileHasher.
#
# Triggers
# ────────
#   • A pushed tag matching   vMAJOR.MINOR.PATCH   → full pipeline
#       audit → build → test → sign → package-msi → sign-msi → release → mirror
#     Produces signed deliverables under /src/filehasher/signed-builds/ on the
#     Linux signer host (exe + zip + msi, each with a .sha256 sidecar), a
#     GitLab Release with package assets attached, AND a mirrored GitHub
#     Release on the configured target repo with the same six signed assets.
#     The mirror stage is allow_failure: true — a GitHub outage or expired
#     PAT surfaces as a yellow warning but doesn't fail the overall release.
#
#   • The "Run pipeline" web button (any ref)
#       → audit → build → test → sign → package-msi → sign-msi
#     Useful for re-signing or ad-hoc builds. The output filename is suffixed
#     with -build.<short_sha>, the FileHasher-latest.* symlinks are NOT touched,
#     and no GitLab Release or GitHub mirror is created.
#
# MSI build topology (why the sign → package-msi → sign-msi ping-pong):
#   The MSI must wrap the ALREADY-SIGNED exe and then be Authenticode-signed
#   itself, and the two capabilities live on different hosts — the HSM is on
#   the Linux signer, while WiX refuses to run anywhere but Windows
#   (wixtoolset/issues#7154, closed not-planned). So the signed exe travels
#   back to the Windows runner as a job artifact (~65 MB, under the server's
#   100 MB artifact cap), wix builds + ICE-validates the MSI there, and the
#   unsigned MSI returns to the signer for the second signing pass.
#
# Stage order:
#   • `audit` runs first as a quick supply-chain sanity check. It is marked
#     allow_failure: true so vulnerable-package findings show as a yellow warning
#     in the pipeline view rather than blocking the release; the goal is
#     visibility, not gating.
#   • `build` runs next because the FlaUI tests in FileHasherApp.Tests launch
#     the actual FileHasher.exe via UI Automation. The test job points the
#     AppFixture at the published binary via FILEHASHER_EXE so the tests verify
#     the exact self-contained single-file artifact that will be signed.
#   • `sign` lists `test` as a need so a red test run blocks the HSM signature.
#
# Runners required
# ────────────────
#   • Tag "windows"      — Windows Server runner, shell/powershell executor,
#                          .NET 8 SDK, the wix dotnet tool (MSI build + ICE
#                          validation), interactive desktop session for FlaUI.
#   • Tag "linux-signer" — Ubuntu host with HSM token, osslsigncode, the cert
#                          chain at the path configured via the SIGNING_BASE_PATH
#                          CI/CD variable, release-cli, zip. Runs as root.
#
# Required CI/CD variables (Settings → CI/CD → Variables)
# ───────────────────────────────────────────────────────
#   HSM_PIN            — the PKCS#11 token PIN.
#   SIGNING_BASE_PATH  — absolute path on the linux-signer host to the directory
#                        holding chain.pem (the code-signing cert chain). Held
#                        in CI/CD variables rather than hardcoded in this file
#                        so the path doesn't appear in the public mirror.
#
# Both variables are marked Masked + Hidden + Protected. The v* tag glob is
# added to Settings → Repository → Protected tags so they're only injected
# into pipelines triggered by release tags.
#
# See ci/README.md for one-time runner setup instructions.

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  PUBLISH_DIR: "FileHasherApp/bin/Release/net8.0-windows/win-x64/publish"
  SIGNED_DIR: "/src/filehasher/signed-builds"

stages:
  - audit
  - build
  - test
  - sign
  - package-msi
  - sign-msi
  - release
  - mirror

workflow:
  rules:
    # Tag pipeline (release).
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    # Manual run via the GitLab UI "Run pipeline" button.
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ── AUDIT ────────────────────────────────────────────────────────────────────
#
# Supply-chain sanity check: scan NuGet dependencies (direct + transitive) for
# packages with known CVEs against the GitHub Advisory Database. Runs in the
# first stage so any finding is visible at the top of the pipeline. Marked
# allow_failure: true — findings produce a yellow warning, not a red blocker.

audit:
  stage: audit
  tags:
    - windows
  allow_failure: true
  cache:
    key: nuget-$CI_PROJECT_ID
    paths:
      - .nuget/packages/
  script:
    - |
      # Advisories that have been reviewed and judged not to apply to this
      # project's threat model. Each entry should mirror a <NuGetAuditSuppress>
      # in the relevant csproj (which silences the same finding for local
      # `dotnet restore` users). Keep the two lists in sync; the script
      # comments and csproj comments should reference each other.
      $suppressedAdvisories = @(
        # GHSA-rxg9-xrhp-64gj — System.Drawing.Common 5.0.2 (transitive via
        # FlaUI in FileHasherApp.Tests). Test-only dep, never shipped; tests
        # do not process attacker-controlled images. See the matching
        # <NuGetAuditSuppress> in FileHasherApp.Tests.csproj.
        'https://github.com/advisories/GHSA-rxg9-xrhp-64gj'
      )

      Write-Host "Restoring solution to populate NuGet metadata..."
      dotnet restore filehasher.sln
      if ($LASTEXITCODE -ne 0) {
        Write-Error "dotnet restore failed; cannot audit packages."
        exit $LASTEXITCODE
      }
      Write-Host ""
      Write-Host "Scanning for vulnerable packages (direct + transitive)..."
      $output = dotnet list filehasher.sln package --vulnerable --include-transitive 2>&1 | Out-String
      Write-Host $output

      if ($output -notmatch 'has the following vulnerable packages') {
        Write-Host "No vulnerable packages found."
        exit 0
      }

      # Pull every GHSA URL out of the output and compare against the suppression list.
      $foundAdvisories = [regex]::Matches($output, 'https://github\.com/advisories/GHSA-[a-zA-Z0-9-]+') |
                           ForEach-Object { $_.Value } |
                           Sort-Object -Unique
      $unsuppressed = @($foundAdvisories | Where-Object { $_ -notin $suppressedAdvisories })

      if ($unsuppressed.Count -eq 0) {
        Write-Host ""
        Write-Host "All findings are on the suppression list; treating scan as clean."
        Write-Host "Suppressed advisories matched: $($foundAdvisories -join ', ')"
        Write-Host "Justifications: see `$suppressedAdvisories at the top of this script."
        exit 0
      }

      Write-Warning "Unsuppressed vulnerable packages detected — see output above. This job is marked failed but the pipeline will continue (allow_failure: true)."
      Write-Warning "Unsuppressed advisories: $($unsuppressed -join ', ')"
      exit 1

# ── BUILD ────────────────────────────────────────────────────────────────────

build:
  stage: build
  tags:
    - windows
  cache:
    key: nuget-$CI_PROJECT_ID
    paths:
      - .nuget/packages/
  script:
    - |
      # Validate the tag matches <Version> in the csproj (tag pipelines only).
      if ($env:CI_COMMIT_TAG) {
        $tagVersion = $env:CI_COMMIT_TAG -replace '^v', ''
        $csproj     = Get-Content FileHasherApp/FileHasherApp.csproj -Raw
        $needle     = "<Version>$([regex]::Escape($tagVersion))</Version>"
        if ($csproj -notmatch $needle) {
          Write-Error ("Tag '{0}' (version '{1}') does not match <Version> in FileHasherApp.csproj. Bump the csproj <Version>, commit, then re-tag." -f $env:CI_COMMIT_TAG, $tagVersion)
          exit 1
        }
        Write-Host "Tag/csproj version match: $tagVersion"
        $version = $tagVersion
      } else {
        $csproj = Get-Content FileHasherApp/FileHasherApp.csproj -Raw
        if ($csproj -match '<Version>([^<]+)</Version>') {
          $version = $matches[1]
        } else {
          Write-Error 'Could not read <Version> from FileHasherApp/FileHasherApp.csproj'
          exit 1
        }
      }
      "VERSION=$version" | Out-File -FilePath build.env -Encoding ascii
      Write-Host "Building FileHasher version: $version"

      Push-Location FileHasherApp
      dotnet publish `
        -c Release `
        -r win-x64 `
        --self-contained true `
        -p:PublishSingleFile=true `
        -p:EnableCompressionInSingleFile=true `
        -p:DebugType=embedded `
        -p:Version=$version `
        -p:Deterministic=true `
        -p:ContinuousIntegrationBuild=true `
        -p:PathMap="$($env:CI_PROJECT_DIR)=/_/"
      $code = $LASTEXITCODE
      Pop-Location
      if ($code -ne 0) { exit $code }
  artifacts:
    name: "FileHasher-$CI_COMMIT_SHORT_SHA-publish"
    paths:
      - $PUBLISH_DIR/
    reports:
      dotenv: build.env
    expire_in: 30 days

# ── TEST ─────────────────────────────────────────────────────────────────────

test:
  stage: test
  tags:
    - windows
  needs:
    - job: build
      artifacts: true
  cache:
    key: nuget-$CI_PROJECT_ID
    paths:
      - .nuget/packages/
  variables:
    # Tell FileHasherApp.Tests/AppFixture.cs to launch the published self-contained
    # binary, not a side-effect bin output. This makes the FlaUI tests verify the
    # exact .exe that the sign stage will sign.
    FILEHASHER_EXE: "$CI_PROJECT_DIR/FileHasherApp/bin/Release/net8.0-windows/win-x64/publish/FileHasher.exe"
  script:
    - dotnet test FileHasherApp.Tests/FileHasherApp.Tests.csproj `
        -c Release `
        --logger "console;verbosity=normal" `
        --logger "trx;LogFileName=test-results.trx" `
        --results-directory TestResults
  artifacts:
    when: always
    paths:
      - TestResults/
    expire_in: 7 days

# ── SIGN ─────────────────────────────────────────────────────────────────────

sign:
  stage: sign
  tags:
    - linux-signer
  needs:
    - job: build
      artifacts: true
    - job: test
  variables:
    OSSLSIGNCODE:  "/usr/local/bin/osslsigncode"
    # SIGNING_BASE_PATH (absolute path to the dir holding chain.pem) is injected
    # at job time as a Protected CI/CD variable from GitLab UI rather than
    # hardcoded here, so the internal disk layout doesn't appear in the public
    # mirror. See ci/README.md under "GitLab project settings" for the value.
    PKCS11_ENGINE: "/usr/lib/x86_64-linux-gnu/engines-3/pkcs11.so"
    PKCS11_MODULE: "/usr/lib/x86_64-linux-gnu/opensc-pkcs11.so"
    TIMESTAMP_URL: "http://timestamp.digicert.com"
    SIGN_NAME:     "FSP Productions LLC"
    SIGN_URL:      "https://www.fspproductions.com/software-projects"
  script:
    - bash ci/sign.sh
  # Only the signed exe travels onward as an artifact — package-msi on the
  # Windows runner needs it to build the MSI around it. The zip stays out to
  # keep the artifact under the server's 100 MB cap (exe+zip ≈ 135 MB).
  artifacts:
    name: "FileHasher-$CI_COMMIT_SHORT_SHA-signed-exe"
    paths:
      - signed-out/FileHasher-*.exe
    expire_in: 7 days

# ── PACKAGE-MSI ──────────────────────────────────────────────────────────────
#
# Wraps the signed exe (artifact from the sign stage) in an MSI via WiX and
# runs full ICE validation on it — `wix msi validate` needs Windows, which is
# also why this job can't live on the signer. Output is UNSIGNED; the next
# stage carries it back to the signer for the Authenticode pass. The wix CLI
# is a dotnet global tool installed for the gitlab-runner user, pinned to
# major version 5: v6+ requires accepting the Open Source Maintenance Fee
# EULA per host, which we don't want as a silent CI dependency (see
# ci/README.md "WiX toolset").

package-msi:
  stage: package-msi
  tags:
    - windows
  needs:
    - job: build      # build.env dotenv → $VERSION
      artifacts: true
    - job: sign       # signed-out/<basename>.exe
      artifacts: true
  variables:
    WIX: 'C:\Users\gitlab-runner\.dotnet\tools\wix.exe'
  script:
    - |
      if ($env:CI_COMMIT_TAG) {
        $basename = "FileHasher-$env:VERSION"
      } else {
        $basename = "FileHasher-$env:VERSION-build.$env:CI_COMMIT_SHORT_SHA"
      }
      $signedExe = "signed-out/$basename.exe"
      if (-not (Test-Path $signedExe)) {
        Write-Error "Signed exe not found at $signedExe (sign-stage artifact missing?)"
        exit 1
      }
      New-Item -ItemType Directory -Force msi-out | Out-Null

      Write-Host "Building MSI from installer/FileHasher.wxs"
      & $env:WIX build installer/FileHasher.wxs `
        -arch x64 `
        -d Version=$env:VERSION `
        -d SignedExe=$signedExe `
        -pdbtype none `
        -o "msi-out/$basename-unsigned.msi"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      Write-Host "Running ICE validation"
      & $env:WIX msi validate "msi-out/$basename-unsigned.msi"
      if ($LASTEXITCODE -ne 0) {
        Write-Error "ICE validation failed — fix installer/FileHasher.wxs before releasing."
        exit $LASTEXITCODE
      }
  artifacts:
    name: "FileHasher-$CI_COMMIT_SHORT_SHA-msi-unsigned"
    paths:
      - msi-out/
    expire_in: 7 days

# ── SIGN-MSI ─────────────────────────────────────────────────────────────────
#
# Second HSM pass: Authenticode-signs the MSI built by package-msi, writes the
# .sha256 sidecar, and persists both to $SIGNED_DIR alongside the exe/zip from
# the first sign stage (plus FileHasher-latest.msi* symlinks on tag pipelines).

sign-msi:
  stage: sign-msi
  tags:
    - linux-signer
  needs:
    - job: build
      artifacts: true
    - job: package-msi
      artifacts: true
  variables:
    OSSLSIGNCODE:  "/usr/local/bin/osslsigncode"
    PKCS11_ENGINE: "/usr/lib/x86_64-linux-gnu/engines-3/pkcs11.so"
    PKCS11_MODULE: "/usr/lib/x86_64-linux-gnu/opensc-pkcs11.so"
    TIMESTAMP_URL: "http://timestamp.digicert.com"
    SIGN_NAME:     "FSP Productions LLC"
    SIGN_URL:      "https://www.fspproductions.com/software-projects"
  script:
    - bash ci/sign-msi.sh

# ── RELEASE ──────────────────────────────────────────────────────────────────
#
# Note: release reads the signed deliverables from $SIGNED_DIR on the linux-signer
# host directly. We deliberately do NOT pass them through GitLab artifacts — they
# total ~135 MB and the round-trip would hit the GitLab server's 100 MB artifact
# size limit, but more importantly they're already on disk on the same host where
# this stage runs, so the upload/download would be pure waste.

release:
  stage: release
  tags:
    - linux-signer
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - job: build
      artifacts: true
    - job: sign
    - job: sign-msi
  script:
    - bash ci/release.sh

# ── MIRROR ───────────────────────────────────────────────────────────────────
#
# Pushes the same v${VERSION} release that the prior stage published to GitLab
# to the GitHub mirror as a GitHub Release with the same six signed assets.
# The MSI's GitHub download URL is the one the winget manifest pins, so a
# failed mirror also blocks that version's winget submission (winget/README.md).
# Uses gh CLI authenticated against /root/.config/gh/hosts.yml (one-time setup
# documented in ci/README.md under "GitHub release mirroring"). Marked
# allow_failure: true so a GitHub-side hiccup doesn't fail the overall release.

mirror-github:
  stage: mirror
  tags:
    - linux-signer
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  allow_failure: true
  needs:
    - job: build
      artifacts: true
    - job: release
  script:
    - bash ci/mirror-to-github.sh
